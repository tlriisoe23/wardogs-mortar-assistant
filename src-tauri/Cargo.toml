[package]
name = "wardogs-mortar-assistant-desktop"
version = "2.1.0"
description = "WARDOGS Mortar & Artillery Assistant (:8099) — Tauri v2 Native Desktop Wrapper & Global Hotkey HUD"
authors = ["AI Stack Workflow"]
edition = "2021"

[lib]
name = "wardogs_mortar_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
